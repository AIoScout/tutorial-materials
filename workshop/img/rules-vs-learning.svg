<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
  </defs>
  <rect width="880" height="260" fill="#ffffff"/>
  <line x1="440" y1="20" x2="440" y2="240" stroke="#d8d9d8" stroke-width="1"/>

  <!-- Panel A: classic programming -->
  <text x="32" y="42" font-size="12" font-weight="700" letter-spacing="2" fill="#78716c">CLASSIC PROGRAMMING</text>
  <rect x="40" y="70" width="120" height="44" fill="#ffffff" stroke="#d8d9d8" stroke-width="1.5"/>
  <text x="100" y="97" font-size="15" font-weight="600" fill="#1a1c1c" text-anchor="middle">Rules</text>
  <rect x="40" y="130" width="120" height="44" fill="#ffffff" stroke="#d8d9d8" stroke-width="1.5"/>
  <text x="100" y="157" font-size="15" font-weight="600" fill="#1a1c1c" text-anchor="middle">Data</text>
  <line x1="160" y1="92" x2="206" y2="114" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="160" y1="152" x2="206" y2="130" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="210" y="100" width="130" height="44" fill="#1a1c1c"/>
  <text x="275" y="127" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Program</text>
  <line x1="340" y1="122" x2="356" y2="122" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="360" y="100" width="76" height="44" fill="#ffffff" stroke="#d8d9d8" stroke-width="1.5"/>
  <text x="398" y="127" font-size="15" font-weight="600" fill="#1a1c1c" text-anchor="middle">Answers</text>
  <text x="32" y="225" font-size="13" fill="#525252">A human writes every rule — works until the images get messy.</text>

  <!-- Panel B: machine learning -->
  <text x="472" y="42" font-size="12" font-weight="700" letter-spacing="2" fill="#78716c">MACHINE LEARNING</text>
  <rect x="480" y="70" width="120" height="44" fill="#ffffff" stroke="#d8d9d8" stroke-width="1.5"/>
  <text x="540" y="97" font-size="15" font-weight="600" fill="#1a1c1c" text-anchor="middle">Data</text>
  <rect x="480" y="130" width="120" height="44" fill="#ffffff" stroke="#d8d9d8" stroke-width="1.5"/>
  <text x="540" y="157" font-size="15" font-weight="600" fill="#1a1c1c" text-anchor="middle">Answers</text>
  <line x1="600" y1="92" x2="646" y2="114" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="600" y1="152" x2="646" y2="130" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="650" y="100" width="130" height="44" fill="#1a1c1c"/>
  <text x="715" y="127" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Training</text>
  <line x1="780" y1="122" x2="794" y2="122" stroke="#78716c" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="798" y="100" width="80" height="44" fill="#ffffff" stroke="#f58331" stroke-width="1.5"/>
  <text x="838" y="127" font-size="15" font-weight="600" fill="#f58331" text-anchor="middle">Rules</text>
  <text x="472" y="225" font-size="13" fill="#525252">The machine writes the rules — you steer it with the examples you collect.</text>
</svg>
