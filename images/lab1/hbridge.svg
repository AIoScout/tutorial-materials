<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="iarr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f58331"/>
    </marker>
  </defs>
  <rect width="880" height="380" fill="#ffffff"/>
  <text x="36" y="40" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b5ba8">THE H-BRIDGE — DIRECTION CONTROL</text>

  <!-- rails -->
  <line x1="140" y1="80" x2="620" y2="80" stroke="#1a1c1c" stroke-width="2.5"/>
  <text x="640" y="85" font-size="13" font-weight="700" fill="#1a1c1c">+V (battery)</text>
  <line x1="140" y1="300" x2="620" y2="300" stroke="#78716c" stroke-width="2.5"/>
  <text x="640" y="305" font-size="13" font-weight="700" fill="#78716c">GND</text>

  <!-- switches: S1 S2 (top), S3 S4 (bottom), closed pairs drawn as solid line, open as gap -->
  <!-- S1 top-left: CLOSED -->
  <line x1="200" y1="80" x2="200" y2="125" stroke="#1a1c1c" stroke-width="2.5"/>
  <line x1="200" y1="125" x2="200" y2="180" stroke="#f58331" stroke-width="4"/>
  <text x="160" y="160" font-size="13" font-weight="700" fill="#1a1c1c">S1</text>
  <text x="138" y="158" font-size="11" fill="#f58331">closed</text>
  <!-- S2 top-right: OPEN -->
  <line x1="560" y1="80" x2="560" y2="130" stroke="#1a1c1c" stroke-width="2.5"/>
  <line x1="560" y1="175" x2="560" y2="195" stroke="#1a1c1c" stroke-width="2.5"/>
  <text x="585" y="160" font-size="13" font-weight="700" fill="#1a1c1c">S2</text>
  <text x="585" y="176" font-size="11" fill="#78716c">open</text>
  <!-- S3 bottom-left: OPEN -->
  <line x1="200" y1="265" x2="200" y2="300" stroke="#1a1c1c" stroke-width="2.5"/>
  <text x="160" y="285" font-size="13" font-weight="700" fill="#1a1c1c">S3</text>
  <text x="138" y="283" font-size="11" fill="#78716c">open</text>
  <!-- S4 bottom-right: CLOSED -->
  <line x1="560" y1="240" x2="560" y2="300" stroke="#f58331" stroke-width="4"/>
  <text x="585" y="280" font-size="13" font-weight="700" fill="#1a1c1c">S4</text>
  <text x="585" y="296" font-size="11" fill="#f58331">closed</text>

  <!-- motor bridge -->
  <line x1="200" y1="190" x2="330" y2="190" stroke="#1a1c1c" stroke-width="2.5"/>
  <line x1="430" y1="190" x2="560" y2="190" stroke="#1a1c1c" stroke-width="2.5"/>
  <circle cx="380" cy="190" r="50" fill="#ffffff" stroke="#1a1c1c" stroke-width="3"/>
  <text x="380" y="198" font-size="22" font-weight="700" fill="#1a1c1c" text-anchor="middle">M</text>
  <text x="380" y="132" font-size="12" fill="#78716c" text-anchor="middle">motor</text>

  <!-- current path (orange) -->
  <path d="M200,84 L200,120 M200,182 L200,188 L332,188" stroke="#f58331" stroke-width="3" fill="none"/>
  <line x1="428" y1="192" x2="556" y2="192" stroke="#f58331" stroke-width="3" marker-end="url(#iarr)"/>
  <line x1="560" y1="196" x2="560" y2="236" stroke="#f58331" stroke-width="3" marker-end="url(#iarr)"/>
  <text x="380" y="230" font-size="12" font-weight="700" fill="#f58331" text-anchor="middle">current flows left → right : FORWARD</text>

  <!-- states summary -->
  <g font-size="13" fill="#525252">
    <text x="36" y="345">Forward: S1 + S4 closed (as drawn)   ·   Reverse: S2 + S3 closed   ·   Brake/stop: all open</text>
    <text x="36" y="368">Speed: PWM switches S1/S4 (or S2/S3) on and off thousands of times per second — duty cycle sets speed, switch pair sets direction.</text>
  </g>
</svg>
