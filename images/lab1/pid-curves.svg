<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="Inter, Arial, sans-serif">
  <rect width="880" height="320" fill="#ffffff"/>
  <text x="36" y="36" font-size="12" font-weight="700" letter-spacing="1.5" fill="#5b5ba8">STEP RESPONSE — WHAT EACH TERM ADDS</text>

  <!-- axes -->
  <line x1="60" y1="260" x2="840" y2="260" stroke="#d8d9d8" stroke-width="1.5"/>
  <line x1="60" y1="260" x2="60" y2="50" stroke="#d8d9d8" stroke-width="1.5"/>
  <text x="60" y="42" font-size="11" fill="#78716c">speed / level</text>
  <text x="840" y="280" font-size="11" fill="#78716c" text-anchor="end">time</text>

  <!-- target line -->
  <line x1="60" y1="120" x2="840" y2="120" stroke="#1a1c1c" stroke-width="1.5" stroke-dasharray="8 5"/>
  <text x="836" y="112" font-size="11" font-weight="700" fill="#1a1c1c" text-anchor="end">target</text>

  <!-- P: steady-state error -->
  <polyline points="60,258 110,210 150,186 190,172 240,164 300,160 360,158 420,157 480,157 540,157 600,157 660,157 720,157 780,157 840,157" fill="none" stroke="#1a1c1c" stroke-width="2.5"/>

  <!-- PI: reaches target but overshoots -->
  <polyline points="60,258 100,196 130,158 155,120 170,86 185,66 200,80 220,104 240,120 260,136 280,124 300,114 320,122 340,116 360,124 380,118 400,121 420,119 440,120 460,119 480,120 500,120 520,120 540,120 560,120 580,120 600,120 620,120 640,120 660,120 680,120 700,120 720,120 740,120 760,120 780,120 800,120 840,120" fill="none" stroke="#78716c" stroke-width="2.5" stroke-dasharray="7 4"/>

  <!-- PID: fast, small overshoot -->
  <polyline points="60,258 95,180 125,136 150,110 170,98 185,104 205,122 225,118 250,122 275,119 300,121 330,120 360,120 390,120 420,120 450,120 480,120 510,120 540,120 570,120 600,120 630,120 660,120 690,120 720,120 750,120 780,120 810,120 840,120" fill="none" stroke="#f58331" stroke-width="3"/>

  <!-- annotations -->
  <line x1="700" y1="120" x2="700" y2="157" stroke="#78716c" stroke-width="1.2"/>
  <text x="706" y="142" font-size="11" fill="#1a1c1c">steady-state error (P only)</text>
  <text x="188" y="58" font-size="11" fill="#78716c">overshoot (PI)</text>
  <text x="150" y="96" font-size="11" fill="#f58331">PID: quick settle</text>

  <!-- legend -->
  <line x1="60" y1="298" x2="88" y2="298" stroke="#1a1c1c" stroke-width="2.5"/>
  <text x="96" y="302" font-size="12" fill="#1a1c1c">P</text>
  <line x1="130" y1="298" x2="158" y2="298" stroke="#78716c" stroke-width="2.5" stroke-dasharray="7 4"/>
  <text x="166" y="302" font-size="12" fill="#1a1c1c">PI</text>
  <line x1="200" y1="298" x2="228" y2="298" stroke="#f58331" stroke-width="3"/>
  <text x="236" y="302" font-size="12" fill="#1a1c1c">PID</text>
</svg>
